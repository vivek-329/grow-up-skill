<!DOCTYPE html>
<html>
<head>
  <title>P2 Student Portal</title>
  <style>
    body{
      font-family: Arial;
      text-align:center;
      padding:40px;
    }

    .box{
      max-width:400px;
      margin:auto;
      padding:20px;
      border:1px solid #ddd;
      border-radius:10px;
    }

    input{
      width:90%;
      padding:10px;
      margin:10px 0;
    }

    button{
      padding:10px 15px;
      cursor:pointer;
    }

    #content{
      display:none;
      margin-top:20px;
      padding:20px;
      background:#f5f5f5;
      border-radius:10px;
    }

    #blocked{
      display:none;
      color:red;
      margin-top:20px;
    }
  </style>
</head>
<body>

<h2>🔐 Student P2 Portal</h2>

<div class="box">

  <input type="email" id="email" placeholder="Enter Email">
  <input type="password" id="password" placeholder="Enter Password">
  <button onclick="loginCheck()">Login</button>

  <div id="content">
    <h3>🎉 Access Granted</h3>
    <p>Welcome Student! Ye tera learning content hai.</p>

    <ul>
      <li>📺 YouTube Videos</li>
      <li>💻 GitHub Projects</li>
      <li>📚 Notes</li>
    </ul>
  </div>

  <div id="blocked">
    ❌ Access Denied / Pending Approval
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBrsmcsae8q786ugs1nfVHxquOErCTQJMw",
  authDomain: "grow-up-skill.firebaseapp.com",
  projectId: "grow-up-skill",
  storageBucket: "grow-up-skill.firebasestorage.app",
  messagingSenderId: "898081404910",
  appId: "1:898081404910:web:b5a70363dbdd7979e100ff"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

window.loginCheck = async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {

    await signInWithEmailAndPassword(auth, email, password);

    const userRef = doc(db, "users", email);
    const userSnap = await getDoc(userRef);

    if(userSnap.exists()){

      const data = userSnap.data();

      if(data.status === "approved"){
        document.getElementById("content").style.display = "block";
      } else {
        document.getElementById("blocked").style.display = "block";
      }

    } else {
      alert("User not found");
    }

  } catch(err){
    alert(err.message);
  }

};

</script>

</body>
</html>
