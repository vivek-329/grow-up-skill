<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth System</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* ✅ FIXED BODY */
body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#667eea,#764ba2);
}

/* ✅ BUTTON (separate, not inside body) */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#ffffff,#e0e7ff);
  color:#333;
  font-weight:bold;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:all 0.3s ease;
}

/* HOVER EFFECT */
button:hover{
  transform:translateY(-3px) scale(1.03);
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* CLICK (PRESS) EFFECT */
button:active{
  transform:scale(0.96);
  box-shadow:0 5px 10px rgba(0,0,0,0.2);
}

/* RIPPLE EFFECT */
button::after{
  content:"";
  position:absolute;
  width:0;
  height:0;
  background:rgba(0,0,0,0.15);
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  transition:width 0.4s ease, height 0.4s ease;
}

button:active::after{
  width:200px;
  height:200px;
}

button{
  letter-spacing:0.5px;
}

/* subtle glow animation */
button:hover{
  box-shadow:0 0 15px rgba(255,255,255,0.6),
             0 10px 25px rgba(0,0,0,0.2);
}

/* MAIN BOX */
.container{
  width:350px;
  background:rgba(255,255,255,0.1);
  padding:30px;
  border-radius:15px;
  backdrop-filter:blur(10px);
  color:white;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  outline:none;
}

/* BUTTON (second style same as tera) */
button{
  border-radius:8px;
  background:white;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
  background:#f1f1f1;
}

/* SWITCH LINKS */
.link{
  margin-top:10px;
  font-size:14px;
  cursor:pointer;
  color:#ddd;
}

.link:hover{
  color:white;
}

/* HIDE */
.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
<div id="loginBox">
  
  <div class="logoBox">
    <img src="fevicon.jpg" alt="logo">
    <h2>Grow-up-skill</h2>
  </div>

  <!-- ✅ FIX: inputs अंदर डाले -->
  <input id="loginEmail" type="email" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <div class="link" onclick="showSignup()">Create Account</div>
  <div class="link" onclick="resetPassword()">Forgot Password?</div>

</div>

<style>
#loginBox{
  text-align:center;
}

.logoBox{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:15px;
}

.logoBox img{
  height:40px;
  width:40px;
  border-radius:10px;
}

.logoBox h2{
  margin:0;
}
</style>

<script>
function resetPassword() {
  const userEmail = document.getElementById("loginEmail").value;

  if (!userEmail) {
    alert("Pehle email enter karo");
    return;
  }

  const resetLink = `https://yourdomain.com/reset.html?email=${userEmail}`;

  emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
    name: userEmail,
    reset_link: resetLink,
    email: userEmail
  })
  .then(() => {
    alert("Reset email sent ✅");
  })
  .catch((err) => {
    alert("Error: " + err.message);
  });
}
</script>

  <!-- SIGNUP -->
  <div id="signupBox" class="hidden">
    <h2>Signup 📝</h2>

    <input id="firstName" placeholder="First Name">
    <input id="lastName" placeholder="Last Name">
    <input id="signupEmail" type="email" placeholder="Email">
    <input id="signupPassword" type="password" placeholder="Password">

    <button onclick="signup()">Signup</button>

    <div class="link" onclick="showLogin()">Already have account?</div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBrsmcsae8q786ugs1nfVHxquOErCTQJMw",
  authDomain: "grow-up-skill.firebaseapp.com",
  projectId: "grow-up-skill"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.showSignup = () => {
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("signupBox").classList.remove("hidden");
};

window.showLogin = () => {
  document.getElementById("signupBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
};

window.login = async () => {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  if (!email || !password) return alert("Enter email & password");

  try {
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, email, password);
    location.href = "dashboard.html";
  } catch (err) {
    alert(err.message);
  }
};

window.signup = async () => {
  const firstName = document.getElementById("firstName").value;
  const lastName = document.getElementById("lastName").value;
  const email = document.getElementById("signupEmail").value;
  const password = document.getElementById("signupPassword").value;

  if (!firstName || !lastName || !email || !password) {
    return alert("Fill all fields");
  }

  try {
    await createUserWithEmailAndPassword(auth, email, password);

    await setDoc(doc(db, "users", email), {
      firstName,
      lastName,
      email,
      status: "pending",
      role: "user"
    });

    alert("Signup successful ✅ (Wait for approval)");
    showLogin();

  } catch (err) {
    alert(err.message);
  }
};

window.resetPassword = async () => {
  const email = document.getElementById("loginEmail").value;

  if (!email) return alert("Enter email first");
     
  try {
    await sendPasswordResetEmail(auth, email);
    alert("Reset email sent 📩");
  } catch (err) {
    alert(err.message);
  }
};
</script>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("fXb-36XnQ_PCGf7sZ");
</script>

</body>
</html>
