<!DOCTYPE html>
<html>
<head>
  <title>Signup</title>
</head>
<body style="text-align:center;font-family:Arial">

<h2>Signup 🚀</h2>

<input id="firstName" placeholder="First Name"><br><br>
<input id="lastName" placeholder="Last Name"><br><br>
<input id="email" type="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="signup()">Create Account</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBrsmcsae8q786ugs1nfVHxquOErCTQJMw",
  authDomain: "grow-up-skill.firebaseapp.com",
  projectId: "grow-up-skill"
});

const auth = getAuth(app);
const db = getFirestore(app);

window.signup = async () => {
  const firstName = document.getElementById("firstName").value;
  const lastName = document.getElementById("lastName").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (!firstName || !lastName || !email || !password) {
    return alert("Fill all fields");
  }

  try {
    await createUserWithEmailAndPassword(auth, email, password);

    await setDoc(doc(db, "users", email), {
      firstName,
      lastName,
      email,
      status: "pending",
      role: "user"
    });

    alert("Signup successful ✅ Wait for approval");
    location.href = "pending.html";

  } catch (err) {
    alert(err.message);
  }
};
</script>

</body>
</html>
